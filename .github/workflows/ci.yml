name: DriveSphere CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Validate Syntax & Lint
        run: |
          node --check server.js
          node --check frontend/app.js
          node --check test_browser.js
          python -m py_compile server/app.py server/routes.py server/models.py server/config.py

      - name: Run Unit & API Integration Tests
        run: npm test

      - name: Start DriveSphere Background Servers
        run: |
          node start.js &
          # Wait up to 15 seconds for port 3000 and 5000 to be live
          for i in {1..15}; do
            if curl -s http://127.0.0.1:3000/api/health > /dev/null; then
              echo "DriveSphere Node server is up on port 3000."
              break
            fi
            sleep 1
          done

      - name: Run End-to-End Headless Browser Tests
        run: npm run test:browser

      - name: Clean Shutdown
        if: always()
        run: |
          pkill -f "node start.js" || true
          pkill -f "node server.js" || true
          pkill -f "python server/app.py" || true
